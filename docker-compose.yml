version: '3.8'

services:
  # Local Development Mock Postgres (Diganti Cloud Supabase pada environment produksi)
  postgres:
    image: postgres:16-alpine
    container_name: punggawa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: punggawa_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local Development Mock Redis (Diganti Cloud Redis / Upstash pada produksi)
  redis:
    image: redis:7-alpine
    container_name: punggawa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Worker Container (Siap dijalankan di Cloud VPS)
  agent-worker:
    build: .
    container_name: punggawa-worker-cloud
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/punggawa_db
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ID=vps-cloud-worker-1
      - TASK_QUEUE_NAME=agent:task:queue
      - LOCK_TTL_SECONDS=120

volumes:
  pgdata:
  redisdata:

